version: '3.8'

# Network segmentation #####################################################
networks:
  # Public-facing: nginx
  frontend:
    driver: bridge
    internal: false
  # Internal: api, db, redis — no direct host access
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:

services:

  # DATABASE #####################################################
  db:
    image: dhi.io/postgres:15-alpine3.22@sha256:8fe0c7235a4c46766dbe5103f3a6d815e29cc07f52b818a5ccb175aa89af1c48
    container_name: taskdb
    env_file: /tmp/vault-env/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    ##### Security hardening #####
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    ##### Resource limits #####
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # CACHE #####################################################
  redis:
    image: dhi.io/redis:7-debian13@sha256:e0d9b24cb3ec38d910bd6f310f6a714854ca242b0535a850800b8a2369e8e1d5
    container_name: taskcache
    env_file: /tmp/vault-env/.env
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - /tmp/vault-env/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", $$REDIS_PASSWORD, "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ##### Security hardening #####
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ##### Resource limits #####
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  # API #####################################################
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dhi-taskapi:latest
    container_name: taskapi
    env_file: /tmp/vault-env/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST:    redis
      REDIS_PORT:    "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    ##### Security hardening #####
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ##### Resource limits #####
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  # REVERSE PROXY #####################################################
  nginx:
    image: dhi.io/nginx:1.29.6-alpine3.23@sha256:d341a76d9daaa4a26ac6b1f1d8c514ec8d2ec2a7087ba8cb88bd89e790739cca
    container_name: taskproxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $(cat /tmp/nginx.pid) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    ##### Security hardening #####
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    ##### Resource limits #####
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 16M