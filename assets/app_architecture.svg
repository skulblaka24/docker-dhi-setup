<svg width="100%" viewBox="0 0 780 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════
       BROWSER
  ══════════════════════════════════════════════ -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="195" y="20" width="140" height="44" rx="8" stroke-width="0.5" style="fill:rgb(68,68,65);stroke:rgb(180,178,169)"/>
    <text x="265" y="38" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-size:14px;font-weight:500">Browser</text>
    <text x="265" y="56" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180,178,169);font-size:12px">HTTP :80</text>
  </g>

  <!-- Arrow: Browser → Nginx -->
  <line x1="265" y1="64" x2="265" y2="108" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px"/>

  <!-- ══════════════════════════════════════════
       DOCKER NETWORK (left/center column)
  ══════════════════════════════════════════════ -->
  <rect x="40" y="108" width="480" height="412" rx="16" fill="none" stroke-width="0.5" stroke-dasharray="6 4" style="stroke:rgba(222,220,209,0.3)"/>
  <text x="56" y="128" style="fill:rgb(156,154,146);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:12px">network (Docker)</text>

  <!-- Nginx -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="115" y="136" width="300" height="56" rx="8" stroke-width="0.5" style="fill:rgb(8,80,65);stroke:rgb(93,202,165)"/>
    <text x="265" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-size:14px;font-weight:500">Nginx</text>
    <text x="265" y="176" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:12px">dhi.io/nginx:1.29.6-alpine3.23</text>
  </g>

  <!-- Route / → static -->
  <path d="M185 192 L130 232 L130 256" fill="none" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px"/>
  <text x="140" y="220" text-anchor="middle" style="fill:rgb(194,192,182);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:12px">/ static</text>

  <!-- Static files -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="56" y="256" width="150" height="56" rx="8" stroke-width="0.5" style="fill:rgb(44,44,41);stroke:rgb(130,128,120)"/>
    <text x="131" y="278" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194,192,182);font-size:13px;font-weight:500">Static files</text>
    <text x="131" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(130,128,120);font-size:11px">./frontend</text>
  </g>

  <!-- Route /api/ → API -->
  <path d="M345 192 L400 232 L400 256" fill="none" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px"/>
  <text x="392" y="220" text-anchor="middle" style="fill:rgb(194,192,182);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:12px">/api/</text>

  <!-- Flask API -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="300" y="256" width="200" height="56" rx="8" stroke-width="0.5" style="fill:rgb(60,52,137);stroke:rgb(175,169,236)"/>
    <text x="400" y="278" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206,203,246);font-size:14px;font-weight:500">Flask API</text>
    <text x="400" y="296" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-size:12px">dhi.io/python:3.11-alpine3.23</text>
  </g>

  <!-- Arrow: API → Postgres -->
  <line x1="360" y1="312" x2="240" y2="376" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px"/>
  <text x="278" y="350" text-anchor="middle" style="fill:rgb(194,192,182);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:12px">database</text>

  <!-- Arrow: API → Redis -->
  <line x1="440" y1="312" x2="440" y2="376" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156,154,146);stroke-width:1.5px"/>
  <text x="462" y="350" text-anchor="start" style="fill:rgb(194,192,182);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:12px">cache</text>

  <!-- PostgreSQL -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="100" y="376" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(12,68,124);stroke:rgb(133,183,235)"/>
    <text x="210" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181,212,244);font-size:14px;font-weight:500">PostgreSQL</text>
    <text x="210" y="416" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,183,235);font-size:12px">dhi.io/postgres:15-alpine3.22</text>
  </g>

  <!-- Redis -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="355" y="376" width="150" height="56" rx="8" stroke-width="0.5" style="fill:rgb(113,43,19);stroke:rgb(240,153,123)"/>
    <text x="430" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245,196,179);font-size:14px;font-weight:500">Redis</text>
    <text x="430" y="416" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240,153,123);font-size:12px">dhi.io/redis:7-debian13</text>
  </g>

  <!-- ══════════════════════════════════════════
       VAULT SIDE PANEL (right, outside Docker)
  ══════════════════════════════════════════════ -->
  <rect x="556" y="108" width="196" height="272" rx="12" fill="none" stroke-width="0.5" stroke-dasharray="5 4" style="stroke:rgba(200,160,60,0.35)"/>
  <text x="572" y="128" style="fill:rgb(160,130,60);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:11px;font-weight:500">host</text>

  <!-- Vault -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="572" y="136" width="164" height="56" rx="8" stroke-width="0.5" style="fill:rgb(45,30,5);stroke:rgb(150,100,20)"/>
    <text x="654" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(230,180,80);font-size:14px;font-weight:500">Vault</text>
    <text x="654" y="176" text-anchor="middle" dominant-baseline="central" style="fill:rgb(150,100,20);font-size:12px">KV v2 · :8200</text>
  </g>

  <!-- Arrow: Vault → Vault Agent -->
  <line x1="654" y1="192" x2="654" y2="228" marker-end="url(#arrow)" style="fill:none;stroke:rgb(150,100,20);stroke-width:1.5px"/>
  <text x="666" y="214" text-anchor="start" style="fill:rgb(150,100,20);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:10px">reads KV</text>

  <!-- Vault Agent -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="572" y="228" width="164" height="56" rx="8" stroke-width="0.5" style="fill:rgb(65,37,5);stroke:rgb(186,117,23)"/>
    <text x="654" y="250" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250,199,117);font-size:14px;font-weight:500">Vault Agent</text>
    <text x="654" y="268" text-anchor="middle" dominant-baseline="central" style="fill:rgb(186,117,23);font-size:12px">vault-agent.hcl</text>
  </g>

  <!-- Arrow: Vault Agent → /tmp/vault-env/ -->
  <line x1="654" y1="284" x2="654" y2="320" marker-end="url(#arrow)" style="fill:none;stroke:rgb(186,117,23);stroke-width:1.5px"/>
  <text x="666" y="306" text-anchor="start" style="fill:rgb(186,117,23);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:10px">renders</text>

  <!-- /tmp/vault-env/ -->
  <g style="font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif">
    <rect x="572" y="320" width="164" height="56" rx="8" stroke-width="0.5" style="fill:rgb(40,40,38);stroke:rgb(120,118,110)"/>
    <text x="654" y="340" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194,192,182);font-size:12px;font-weight:500">/tmp/vault-env/</text>
    <text x="654" y="358" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,118,110);font-size:11px">.env · redis.conf</text>
  </g>

  <!-- ══════════════════════════════════════════
       BIND MOUNT ARROWS (straight, amber)
       /tmp/vault-env/ → PostgreSQL (.env)
       /tmp/vault-env/ → Redis (redis.conf)
       /tmp/vault-env/ → Flask API (.env)
  ══════════════════════════════════════════════ -->

  <!-- → PostgreSQL: .env -->
  <line x1="572" y1="348" x2="322" y2="404" marker-end="url(#arrow)" style="fill:none;stroke:rgb(186,117,23);stroke-width:1.2px;stroke-dasharray:5 3"/>
  <text x="440" y="362" text-anchor="middle" style="fill:rgb(186,117,23);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:10px">.env (env_file)</text>

  <!-- → Redis: redis.conf -->
  <line x1="572" y1="368" x2="507" y2="404" marker-end="url(#arrow)" style="fill:none;stroke:rgb(186,117,23);stroke-width:1.2px;stroke-dasharray:5 3"/>
  <text x="556" y="394" text-anchor="middle" style="fill:rgb(186,117,23);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:10px">redis.conf</text>

  <!-- → Flask API: .env -->
  <line x1="572" y1="330" x2="502" y2="284" marker-end="url(#arrow)" style="fill:none;stroke:rgb(186,117,23);stroke-width:1.2px;stroke-dasharray:5 3"/>
  <text x="548" y="300" text-anchor="middle" style="fill:rgb(186,117,23);font-family:&quot;Anthropic Sans&quot;,-apple-system,sans-serif;font-size:10px">.env (env_file)</text>

</svg>
